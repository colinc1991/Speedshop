<div class="container-fluid">
    <div class="row">
        <div class="col-md-6">
            <h1>Products</h1>
            <div *ngFor="let item of products">
                {{item.productName}}
            </div>
        </div>
        <div class="col-md-6">
            <h1>Create new category</h1>
            <input type="text" name="new-category" id="new-category" [(ngModel)]="newCategory">
            <button (click)="createCategory()">Create</button>

            <div class="row">
                <div class="col-md-12">
                    <h2>Current categories</h2>
                    <div *ngFor="let category of categories">
                        {{category}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
