@if (values.length > 0) {
  <div class="main-container noselect" (click)="onSelectClick()">
    {{selectedItem}} <fa-icon [icon]="faChevronDown"></fa-icon>
    @if (displayDropdown) {
      <div class="results-container">
        @for (value of values; track value) {
          <div class="results-item" (click)="onValueClick(value)">
            {{value}}
          </div>
        }
      </div>
    }
  </div>
}
