<div class="results-container">
  @if (mode=='Pantry') {
    <div>
      @for (item of pantryItems; track item) {
        <div>
          <div>
            <app-search-result-item [mode]="mode" [receivedPantryItem]=item></app-search-result-item>
          </div>
        </div>
      }
    </div>
  }
  @if (mode=='Recipe') {
    <div>
      @for (item of recipes; track item) {
        <div>
          <div>
            <app-search-result-item [mode]="mode" [receivedRecipe]=item></app-search-result-item>
          </div>
        </div>
      }
    </div>
  }
</div>
