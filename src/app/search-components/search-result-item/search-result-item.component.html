@if (mode=='Pantry') {
  <div>
    <div class="flex">
      <div class="item-container">
        {{receivedPantryItem.name}}
      </div>
      <div class="btn-container">
        @if (receivedPantryItem.added == false) {
          <fa-icon [icon]="faCirclePlus" (click)="addToShoppingList(receivedPantryItem)"></fa-icon>
        }
        @if (receivedPantryItem.added == true) {
          <fa-icon [icon]="faCircleCheck" (click)="removeFromShoppingList(receivedPantryItem)"></fa-icon>
        }
      </div>
    </div>
  </div>
}

@if (mode=='Recipe') {
  <div>
    <div class="flex">
      <div class="item-container">
        {{receivedRecipe.name}}
      </div>
      <div class="btn-container">
        @if (receivedRecipe.added == false) {
          <fa-icon [icon]="faCirclePlus" (click)="addRecipeToShoppingList(receivedRecipe)"></fa-icon>
        }
        @if (receivedRecipe.added == true) {
          <fa-icon [icon]="faCircleCheck" (click)="removeRecipeFromShoppingList(receivedRecipe)"></fa-icon>
        }
      </div>
    </div>
  </div>
}
